name: Build KeuanganKu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Ambil repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 4. Install Android SDK yang diperlukan
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses || true

      # 5. Install Gradle 8.9 secara manual
      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O /tmp/gradle.zip

          mkdir -p "$HOME/gradle"

          unzip -q \
            /tmp/gradle.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

          "$HOME/gradle/gradle-8.9/bin/gradle" --version

      # 6. Cari file source ZIP
      - name: Find source ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 7. Extract source code
      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q \
            "${{ steps.find_zip.outputs.zip }}" \
            -d source

          echo "Isi source:"
          find source -maxdepth 3 -type f | head -100

      # 8. Cari project Android
      - name: Locate Android project
        id: locate_project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find source \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle.kts tidak ditemukan."
            echo "Isi folder source:"
            find source -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Project Android ditemukan:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 9. Periksa struktur project
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.locate_project.outputs.project_dir }}"

          echo "Memeriksa:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo ""
          echo "================================"
          echo "STRUKTUR PROJECT OK"
          echo "================================"

      # 10. Build APK
      - name: Build debug APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Memulai build KeuanganKu..."

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # 11. Cari APK hasil build
      - name: Find APK
        id: find_apk
        shell: bash
        run: |
          set -e

          APK_DIR="${{ steps.locate_project.outputs.project_dir }}/app/build/outputs/apk/debug"

          echo "Mencari APK di:"
          echo "$APK_DIR"

          APK_FILE="$(find "$APK_DIR" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "================================"
          echo "APK BERHASIL DIBUAT"
          echo "================================"
          ls -lh "$APK_FILE"

          echo "apk=$APK_FILE" >> "$GITHUB_OUTPUT"

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeuanganKu-2.0-debug
          path: ${{ steps.find_apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
