name: Build KeuanganKu APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract source code
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP source code tidak ditemukan!"
            exit 1
          fi
          mkdir source
          unzip -q "$ZIP_FILE" -d source

      - name: Build APK
        run: |
          cd source/KeuanganKu
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeuanganKu-2.0-APK
          path: source/KeuanganKu/app/build/outputs/apk/debug/app-debug.apk
